<!DOCTYPE html>
<html lang="en" dir="auto">
  <head>
    <title>{% block title %}{% endblock %} - Pentest Party</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="index, follow">
    <meta name="description" content="{{ page.plain_content|replace('\n', ' ')|truncate(180, False) }}">
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="{{ page.title|e }}"/>
    {% if page.image -%}
    <meta property="og:image" content="{{ options.public_url|e }}/{{ page.image|e }}"/>
    {% endif -%}
    <meta property="og:url" content="{{ options.public_url|e }}/{{ page.slug|e }}"/>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title|e }}"/>
    {% if page.image -%}
    <meta name="twitter:image" content="{{ options.public_url|e }}/{{ page.image|e }}"/>
    {% endif -%}
    <meta name="twitter:url" content="{{ options.public_url|e }}/{{ page.slug|e }}"/>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/mvp.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/pygments-light.css">
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="/static/pygments-dark.css">
    <meta http-equiv="Content-Security-Policy" content="script-src static.cloudflareinsights.com;connect-src cloudflareinsights.com;object-src 'none';base-uri 'none';frame-src 'none';upgrade-insecure-requests;">
  </head>
  <body id="top">
    <header>
      <nav>
        <a href="/">
          <h3>
            <svg width="1rem" height="1rem" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <title>Home</title>
              <use href="/static/feather-sprite.svg#zap"/>
            </svg>
            <span>Pentest Party</span>
          </h3>
        </a>
        <ul>
          <li>
            <a href="https://github.com/dadevel">
              <svg width="1rem" height="1rem" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title>GitHub</title>
                <use href="/static/feather-sprite.svg#github"/>
              </svg>
            </a>
          </li>
          <li>
            <a href="https://twitter.com/0x64616e">
              <svg width="1rem" height="1rem" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title>Twitter</title>
                <use href="/static/feather-sprite.svg#twitter"/>
              </svg>
            </a>
          </li>
          <li>
            <a href="/feed.xml">
              <svg width="1rem" height="1rem" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title>RSS Feed</title>
                <use href="/static/feather-sprite.svg#rss"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="content">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer>
      <hr>
      <p><small>Licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></small></p>
    </footer>
  </body>
</html>
